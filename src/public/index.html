<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TextTV Online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ─── TOPBAR ─── -->
    <header class="topbar" role="banner">
      <div class="topbar-inner">
        <a href="/" class="logo" aria-label="TextTV Online – startsida">
          <span class="logo-icon" aria-hidden="true">▦</span>
          <span class="logo-text">TextTV<em>Online</em></span>
        </a>

        <!-- Mobile: toggle button for sidebar -->
        <button
          type="button"
          class="sidebar-toggle"
          id="sidebarToggle"
          aria-expanded="false"
          aria-controls="sidebar"
          aria-label="Visa sidlista"
        >
          ☰ Sidor
        </button>

        <div class="searchbox" role="search">
          <input
            type="text"
            id="pageInput"
            class="page-input"
            placeholder="Sid 100–899…"
            autocomplete="off"
            inputmode="numeric"
            pattern="[0-9]*"
            aria-label="Skriv ett sidnummer och tryck Enter"
          />
          <button
            type="button"
            class="page-btn"
            id="goBtn"
            aria-label="Gå till sida"
          >
            →
          </button>
        </div>
      </div>
    </header>

    <!-- ─── MAIN LAYOUT ─── -->
    <div class="app-layout">
      <!-- Overlay for mobile drawer -->
      <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

      <!-- ─── CONTENT VIEW ─── -->
      <main class="content-area" id="main-content">
        <!-- Page title — hidden on start page, shown when browsing -->
        <div class="content-header" id="content-header" hidden>
          <h1 class="content-title" id="content-title">Hem</h1>
          <span
            class="content-pagenr"
            id="content-pagenr"
            aria-label="Sidnummer"
          ></span>
        </div>

        <!-- Hero + weather widget — only shown on start page -->
        <div class="hero-container" id="hero-container" hidden>
          <div class="hero">
            <p class="hero-kicker">Sveriges nyheter</p>
            <h1 class="hero-title">Text-TV<br /><em>Online</em></h1>
            <p class="hero-sub">Alltid uppdaterat. Alltid tillgängligt.</p>
          </div>
          <div id="weather-widget" aria-label="Aktuellt väder"></div>
        </div>

        <!-- Content -->
        <div
          class="page-viewer"
          id="page-viewer"
          aria-live="polite"
          aria-busy="true"
        ></div>

        <!-- Browse buttons -->
        <div
          class="page-nav"
          role="navigation"
          aria-label="Bläddra bland sidor"
        >
          <button
            type="button"
            class="page-nav-btn"
            id="prevBtn"
            aria-label="Föregående sida"
            disabled
          >
            ← Föregående
          </button>
          <span
            class="page-nav-info"
            id="page-nav-info"
            aria-live="polite"
          ></span>
          <button
            type="button"
            class="page-nav-btn"
            id="nextBtn"
            aria-label="Nästa sida"
          >
            Nästa →
          </button>
        </div>
      </main>

    </footer>

</html>
